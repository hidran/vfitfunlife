<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>V App Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#1c3024", 
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center p-4 justify-between z-10">
<button class="flex size-12 shrink-0 items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-sm font-medium text-slate-500 dark:text-slate-400">Step 1 of 1</div>
</div>
<!-- HeaderImage (Modified for Hero vibe) -->
<div class="@container px-4 pb-4">
<div class="w-full h-48 bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-2xl relative" data-alt="Abstract energetic neon green waves on dark background representing fitness energy" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAOtgccnE5tVlrmLS0RVaGrDunCrn4ByahWXPZckJEIKbbSxsyy58mLdYBPSkJoojGmXnsJjRfOk9IfTpsthisS86xZn_baCjD0Uj1PPycxAcZEg4MvrKzQ9MQfgnMrPhJzbWU4ZSo7tQZL-gzWdl93oM5Yt5Har6wbQsKeqsExsMjIYlHT6UHrXhEYDN9xjXgYYKIP52gVv1jUF1MxvVPe2MRoJ4k2Sj6tdFfHaYJ3dPd3YYWp9WJJZ4pbcKN6-wxrMzhl2WCl-4OQ");'>
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-background-dark/50 to-transparent opacity-90 dark:opacity-100"></div>
<div class="absolute inset-0 flex items-center justify-center">
<!-- V Logo Simulation -->
<div class="w-20 h-20 rounded-full border-4 border-primary flex items-center justify-center bg-black/30 backdrop-blur-sm shadow-[0_0_20px_rgba(19,236,91,0.5)]">
<span class="text-primary text-5xl font-bold italic tracking-tighter">V</span>
</div>
</div>
</div>
</div>
<!-- Headline & Body Text -->
<div class="px-6 text-center">
<h1 class="text-3xl font-bold leading-tight mb-2 tracking-tight">Join the V Movement</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed">Unlock your potential in fitness, fun, and life. Start your journey today.</p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-4 px-4 py-6 w-full max-w-md mx-auto">
<!-- Full Name -->
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<input class="w-full bg-white dark:bg-surface-dark border-none rounded-full py-4 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-[#23482f] transition-all h-14" placeholder="Full Name" type="text"/>
</div>
<!-- Email -->
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="w-full bg-white dark:bg-surface-dark border-none rounded-full py-4 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-[#23482f] transition-all h-14" placeholder="Email Address" type="email"/>
<!-- Validation Checkmark Example -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary opacity-0 group-focus-within:opacity-100 transition-opacity pointer-events-none">
<span class="material-symbols-outlined text-lg">check_circle</span>
</div>
</div>
<!-- Password -->
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full bg-white dark:bg-surface-dark border-none rounded-full py-4 pl-12 pr-12 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-[#23482f] transition-all h-14" placeholder="Create Password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Interest Selector -->
<div class="mt-4">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-3 px-2">What is your main focus?</label>
<div class="grid grid-cols-3 gap-3">
<!-- VFit - Selected State -->
<button class="relative flex flex-col items-center justify-center p-3 rounded-2xl bg-primary text-background-dark ring-2 ring-primary transition-all">
<span class="material-symbols-outlined mb-1 text-[24px]">fitness_center</span>
<span class="text-xs font-bold">VFit</span>
<div class="absolute top-2 right-2 size-2 bg-background-dark rounded-full"></div>
</button>
<!-- VFun - Inactive State -->
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-white dark:bg-surface-dark text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-[#23482f] hover:text-primary transition-all group">
<span class="material-symbols-outlined mb-1 text-[24px] group-hover:scale-110 transition-transform">celebration</span>
<span class="text-xs font-medium">VFun</span>
</button>
<!-- VLife - Inactive State -->
<button class="flex flex-col items-center justify-center p-3 rounded-2xl bg-white dark:bg-surface-dark text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-[#23482f] hover:text-primary transition-all group">
<span class="material-symbols-outlined mb-1 text-[24px] group-hover:scale-110 transition-transform">spa</span>
<span class="text-xs font-medium">VLife</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-6 flex flex-col gap-4">
<button class="w-full bg-primary hover:bg-[#0fd650] text-background-dark font-bold text-lg h-14 rounded-full shadow-[0_4px_14px_rgba(19,236,91,0.4)] transition-all transform active:scale-95 flex items-center justify-center gap-2">
                    Start My Journey
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase tracking-wide">Or continue with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-12 bg-white dark:bg-surface-dark rounded-full border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-[#23482f] transition-colors text-slate-900 dark:text-white font-medium text-sm">
<img alt="Google Logo" class="size-5" data-alt="Google G logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyFnDVDfPxvJRdA5T7yXeYHYsC1IybF7mTFWpyR0Ox8V-qMH5_zvcFvAL2uOYRbND0Er3lvgMH4CVWDsYxE3BtCKq6a-f2ucgwA66zHMQiT3EREcr16vZX3ZuXT3Rq3a0xD5TTm8Ejy0QO_CqVJVResCXv00wsVx3MckyKTMGRnRGqEm8NYI9mxy7pCQS72To0ItEJE7g9kc_2L742FQSUiGTIVApUHbhb_DTNg18caBgP2g9Y-91VVJslPqrEWMNGiifORWqwUz3S"/>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 h-12 bg-white dark:bg-surface-dark rounded-full border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-[#23482f] transition-colors text-slate-900 dark:text-white font-medium text-sm">
<span class="material-symbols-outlined text-xl">ios</span>
                        Apple
                    </button>
</div>
</div>
<!-- Footer -->
<div class="mt-6 text-center">
<p class="text-slate-500 text-sm">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline decoration-primary underline-offset-4" href="#">Log in</a>
</p>
</div>
</div>
<div class="h-10"></div> <!-- Bottom Spacer -->
</div>
</body></html>
