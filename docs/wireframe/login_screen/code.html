<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>V App Login</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
              "glass-light": "rgba(255, 255, 255, 0.05)",
              "glass-border": "rgba(255, 255, 255, 0.1)",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
                "glow": "0 0 20px rgba(19, 236, 91, 0.5)",
                "glow-sm": "0 0 10px rgba(19, 236, 91, 0.3)",
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-input:focus-within {
            border-color: #13ec5b;
            box-shadow: 0 0 15px rgba(19, 236, 91, 0.15);
            background: rgba(255, 255, 255, 0.07);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display antialiased text-white selection:bg-primary selection:text-background-dark overflow-x-hidden">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden">
<!-- Immersive Background -->
<div class="absolute inset-0 z-0">
<!-- Abstract gradient/shape background to simulate the fitness vibe -->
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&amp;w=1470&amp;auto=format&amp;fit=crop')] bg-cover bg-center opacity-40 mix-blend-overlay" data-alt="Abstract dark gym background with weights"></div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-b from-[#102216]/80 via-[#102216]/90 to-[#102216]"></div>
<!-- Decorative Glow -->
<div class="absolute -top-[20%] left-1/2 -translate-x-1/2 w-[120%] h-[50%] bg-primary/10 blur-[100px] rounded-full pointer-events-none"></div>
</div>
<!-- Main Content Area -->
<div class="relative z-10 flex flex-1 flex-col items-center justify-center px-6 py-8 w-full max-w-md mx-auto h-full">
<!-- Header Section -->
<div class="flex flex-col items-center w-full mb-10">
<!-- Animated/Glowing Logo -->
<div class="relative mb-6 group">
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full scale-150 animate-pulse"></div>
<div class="relative flex items-center justify-center w-20 h-20 rounded-full glass shadow-glow-sm">
<span class="text-5xl font-extrabold text-primary italic tracking-tighter drop-shadow-md">V</span>
</div>
</div>
<h2 class="text-3xl font-bold text-center text-white mb-2 tracking-tight">Welcome Back, Athlete</h2>
<p class="text-gray-400 text-sm text-center font-light">Enter your details to access your V-Life</p>
</div>
<!-- Form Section -->
<form class="w-full space-y-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="group">
<div class="glass glass-input flex items-center w-full rounded-full px-5 transition-all duration-300">
<span class="material-symbols-outlined text-gray-400 mr-3 group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-transparent border-none text-white placeholder-gray-500 focus:ring-0 h-14 text-base font-light px-0" placeholder="Enter your email" type="email" value=""/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<div class="glass glass-input flex items-center w-full rounded-full px-5 transition-all duration-300">
<span class="material-symbols-outlined text-gray-400 mr-3 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-transparent border-none text-white placeholder-gray-500 focus:ring-0 h-14 text-base font-light px-0" placeholder="••••••••" type="password" value=""/>
<button class="text-gray-500 hover:text-white transition-colors focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full">
<a class="text-sm text-primary/80 hover:text-primary hover:underline transition-all font-normal" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full h-14 mt-4 rounded-full bg-gradient-to-r from-primary to-[#0ebd47] text-background-dark font-bold text-lg shadow-glow hover:shadow-[0_0_30px_rgba(19,236,91,0.6)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 tracking-wide uppercase">
                Login
            </button>
</form>
<!-- Social Login Divider -->
<div class="w-full my-8 flex items-center gap-4">
<div class="h-px bg-gradient-to-r from-transparent via-white/20 to-transparent flex-1"></div>
<span class="text-xs text-gray-500 font-medium uppercase tracking-wider">Or continue with</span>
<div class="h-px bg-gradient-to-r from-transparent via-white/20 to-transparent flex-1"></div>
</div>
<!-- Social Buttons -->
<div class="flex gap-4 w-full justify-center">
<button class="w-16 h-16 rounded-full glass hover:bg-white/10 flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95 group">
<img alt="Google logo" class="w-6 h-6 opacity-80 group-hover:opacity-100 transition-opacity" data-alt="Google G logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCK3BFtLhHJYujYvLIYpxRE2REzCagFffOMS7KwN6PTuRWlyWx9uQObIlXsnqZcPbgjynshYqoRRyyBkMREIOsaJ2P2rSJfGAlqNDhaz1kXe1btWzivh-3ypf4CjHX8yp3wyrxrNt6OwkVfsNUry6R8YNyZAnkmamu_td14By825fk33NmpgNfzPomlP_DXt9xgx9C_Zrg7dvYD1GhNlVpiNM3wp90gkTdgGI4LOb7CHkv3VQwivVrjkW-2FnARRwN8nZYR0FMA9sRd"/>
</button>
<button class="w-16 h-16 rounded-full glass hover:bg-white/10 flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95 group">
<img alt="Apple logo" class="w-6 h-6 invert opacity-80 group-hover:opacity-100 transition-opacity" data-alt="Apple logo silhouette" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaB34wRG5B9yBRQxSH9Z38Z7-frHwshHRVNvluh2VTudAn4OtFc6lRxEGjWoEmlrahOgc0_9EeMcdaWuuh1YnHfVHB10DI2YfSOK6vMNSLXO9gF4pwDv5cjJzpgos0zraaKlh5yMPXFamnVNbyDavpD9IEzHwAimObr4P1AIJfCJh2VtqxcTpleTsw1QVveIUmWKxCBfaKJsd--nn84gcg0Liup8_G4nwmNAULitn7S5X2IPWBwT7d-Xr6m0CemX0xZGvZE_rfC68U"/>
</button>
</div>
<!-- Footer -->
<div class="mt-auto pt-8 pb-4">
<p class="text-gray-400 text-sm">
                New to V? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</body></html>
