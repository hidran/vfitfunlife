<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile Screen</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "accent-orange": "#FF8C42",
                        "accent-purple": "#8A4FFF",
                        "surface-dark": "#1A2C22",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "1.5rem", "xl": "2rem", "2xl": "2.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary selection:text-black">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between sticky top-0 z-50 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md">
<button class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Profile</h2>
<button class="flex w-12 items-center justify-end group">
<p class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0 group-hover:underline">Edit</p>
</button>
</div>
<div class="flex-1 overflow-y-auto no-scrollbar pb-24">
<!-- Profile Header Section -->
<div class="flex flex-col items-center pt-4 px-6 gap-6">
<!-- Avatar & Name -->
<div class="flex flex-col items-center gap-4 relative w-full">
<div class="relative group cursor-pointer">
<div class="bg-center bg-no-repeat bg-cover rounded-full h-32 w-32 border-4 border-primary shadow-[0_0_20px_rgba(19,236,91,0.3)] transition-transform transform group-hover:scale-105" data-alt="Fitness user portrait smiling with sportswear" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBQrLJg3V4j08AKMnB_6BaAz5Q9wSVYbpf3qBQiyjsEYPPn2rYbljAoncv0MwARyTS80mNVBqLcezyG1m1DgL7fQmWd_NvTrkVg38GOLQyYpl6YOAiYyyBrmF9v1ykCuHLHUGznxoAS61PmZA_Ojh0Y-4pWx2Rg1J5uoMFGGPQikYsc-_G5MeBrpwEYJiGg7odFoDghbyn3exz5YE17mu52IIfRxrHJc8oy_9ZiKbVSBqpp1-3hfgvBCf-wDSyuCffCYRgWnZ8WGpiO");'>
</div>
<div class="absolute bottom-1 right-1 bg-surface-dark p-1.5 rounded-full border border-white/10 shadow-lg">
<span class="material-symbols-outlined text-primary text-[18px]">photo_camera</span>
</div>
</div>
<div class="flex flex-col items-center">
<h1 class="text-2xl font-bold tracking-tight text-center text-slate-900 dark:text-white">Jane Doe</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Premium Member</p>
</div>
</div>
<!-- Toggle Switch (Prof/Privato) -->
<div class="w-full max-w-[240px]">
<div class="relative flex h-12 w-full items-center rounded-full bg-slate-200 dark:bg-surface-dark p-1 shadow-inner">
<div class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] rounded-full bg-white dark:bg-primary shadow-sm transition-all duration-300 ease-in-out translate-x-0"></div>
<label class="z-10 flex cursor-pointer h-full flex-1 items-center justify-center rounded-full text-sm font-semibold transition-colors text-slate-900 dark:text-background-dark">
<input checked="" class="hidden peer" name="role" type="radio" value="Prof"/>
<span>Prof</span>
</label>
<label class="z-10 flex cursor-pointer h-full flex-1 items-center justify-center rounded-full text-sm font-semibold transition-colors text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-white">
<input class="hidden peer" name="role" type="radio" value="Privato"/>
<span>Privato</span>
</label>
</div>
</div>
</div>
<!-- Stats Section -->
<div class="flex flex-row gap-3 p-4 mt-2 overflow-x-auto no-scrollbar">
<!-- Points Card (Primary Green Theme) -->
<div class="flex min-w-[140px] flex-1 flex-col gap-1 rounded-2xl p-5 bg-gradient-to-br from-surface-dark to-surface-dark/50 border border-white/5 relative overflow-hidden group">
<div class="absolute -right-4 -top-4 w-16 h-16 bg-primary/20 rounded-full blur-2xl group-hover:bg-primary/30 transition-all"></div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">star</span>
<p class="text-slate-400 text-xs font-medium uppercase tracking-wider">Points</p>
</div>
<p class="text-white tracking-tight text-2xl font-bold">1,240</p>
</div>
<!-- Balance Card (Orange Accent Theme - VFun) -->
<div class="flex min-w-[140px] flex-1 flex-col gap-1 rounded-2xl p-5 bg-gradient-to-br from-surface-dark to-surface-dark/50 border border-white/5 relative overflow-hidden group">
<div class="absolute -right-4 -top-4 w-16 h-16 bg-accent-orange/20 rounded-full blur-2xl group-hover:bg-accent-orange/30 transition-all"></div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-accent-orange text-[20px]">account_balance_wallet</span>
<p class="text-slate-400 text-xs font-medium uppercase tracking-wider">Balance</p>
</div>
<p class="text-white tracking-tight text-2xl font-bold">€45.00</p>
</div>
<!-- Challenges Card (Purple Accent Theme - VLife) -->
<div class="flex min-w-[140px] flex-1 flex-col gap-1 rounded-2xl p-5 bg-gradient-to-br from-surface-dark to-surface-dark/50 border border-white/5 relative overflow-hidden group">
<div class="absolute -right-4 -top-4 w-16 h-16 bg-accent-purple/20 rounded-full blur-2xl group-hover:bg-accent-purple/30 transition-all"></div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-accent-purple text-[20px]">emoji_events</span>
<p class="text-slate-400 text-xs font-medium uppercase tracking-wider">Wins</p>
</div>
<p class="text-white tracking-tight text-2xl font-bold">12</p>
</div>
</div>
<!-- List Menu -->
<div class="flex flex-col px-4 gap-2 mt-2">
<h3 class="px-2 text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Account</h3>
<!-- Personal Info -->
<button class="flex items-center gap-4 bg-white dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.98] transition-all group">
<div class="flex items-center justify-center rounded-full bg-slate-100 dark:bg-white/10 shrink-0 size-10 text-slate-600 dark:text-primary group-hover:bg-primary group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<div class="flex flex-col items-start flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal truncate">Personal Info</p>
<p class="text-slate-500 dark:text-slate-400 text-xs truncate">Manage your details</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- My Bookings -->
<button class="flex items-center gap-4 bg-white dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.98] transition-all group">
<div class="flex items-center justify-center rounded-full bg-slate-100 dark:bg-white/10 shrink-0 size-10 text-slate-600 dark:text-accent-orange group-hover:bg-accent-orange group-hover:text-white transition-colors">
<span class="material-symbols-outlined">calendar_month</span>
</div>
<div class="flex flex-col items-start flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal truncate">My Bookings</p>
<p class="text-slate-500 dark:text-slate-400 text-xs truncate">View upcoming classes</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- Payment Methods -->
<button class="flex items-center gap-4 bg-white dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.98] transition-all group">
<div class="flex items-center justify-center rounded-full bg-slate-100 dark:bg-white/10 shrink-0 size-10 text-slate-600 dark:text-accent-purple group-hover:bg-accent-purple group-hover:text-white transition-colors">
<span class="material-symbols-outlined">credit_card</span>
</div>
<div class="flex flex-col items-start flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal truncate">Payment Methods</p>
<p class="text-slate-500 dark:text-slate-400 text-xs truncate">Cards and wallet</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<!-- Settings -->
<button class="flex items-center gap-4 bg-white dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.98] transition-all group">
<div class="flex items-center justify-center rounded-full bg-slate-100 dark:bg-white/10 shrink-0 size-10 text-slate-600 dark:text-white group-hover:bg-white group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined">settings</span>
</div>
<div class="flex flex-col items-start flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal truncate">Settings</p>
<p class="text-slate-500 dark:text-slate-400 text-xs truncate">App preferences</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
</div>
<div class="p-6">
<button class="w-full py-4 text-rose-500 hover:text-rose-400 font-medium text-sm transition-colors border border-rose-500/20 hover:border-rose-500/50 rounded-xl">
                    Log Out
                </button>
</div>
</div>
<!-- Bottom Navigation (Visual Mockup) -->
<div class="fixed bottom-0 w-full max-w-md bg-surface-dark/95 backdrop-blur-lg border-t border-white/5 p-2 px-6 flex justify-between items-center z-50 rounded-t-3xl">
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined">fitness_center</span>
<span class="text-[10px] font-medium">VFit</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined">celebration</span>
<span class="text-[10px] font-medium">VFun</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined">spa</span>
<span class="text-[10px] font-medium">VLife</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-primary transition-colors">
<div class="h-1 w-8 bg-primary rounded-full absolute -top-[1px]"></div>
<span class="material-symbols-outlined filled">person</span>
<span class="text-[10px] font-medium">Profile</span>
</button>
</div>
</div>
</body></html>
