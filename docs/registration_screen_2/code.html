<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>V App Registration | Goal-Oriented Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f4f7f5",
                        "background-dark": "#0a0f0c",
                        "surface-dark": "#141d17", 
                        "surface-light": "#ffffff",
                        "border-dark": "#2a3a2f",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        :root {
            --primary-glow: rgba(19, 236, 91, 0.15);
        }
        body {
            min-height: 100dvh;
        }
        .tracker-input {
            @apply w-full bg-surface-dark border border-border-dark rounded-md py-3 pl-11 pr-4 text-white placeholder:text-slate-500 focus:ring-1 focus:ring-primary focus:border-primary transition-all h-12 text-sm;
        }
        .step-indicator {
            @apply h-1.5 flex-1 bg-border-dark rounded-full overflow-hidden;
        }
        .step-indicator-active {
            @apply h-full bg-primary w-1/3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto border-x border-border-dark/30">
<div class="sticky top-0 z-20 bg-background-dark/80 backdrop-blur-md border-b border-border-dark">
<div class="flex items-center px-4 py-4 justify-between">
<button class="flex size-10 items-center justify-center rounded-md border border-border-dark hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined text-xl">close</span>
</button>
<div class="text-xs font-bold tracking-widest uppercase text-slate-400">Profile Setup</div>
<div class="text-xs font-mono text-primary">35%</div>
</div>
<div class="px-4 pb-4 flex gap-1.5">
<div class="step-indicator"><div class="step-indicator-active w-full"></div></div>
<div class="step-indicator"><div class="h-full bg-primary/20 w-1/2"></div></div>
<div class="step-indicator"></div>
</div>
</div>
<div class="p-6">
<div class="mb-8">
<div class="flex items-center gap-3 mb-2">
<div class="size-8 rounded border border-primary/50 flex items-center justify-center bg-primary/10">
<span class="text-primary font-bold text-lg italic">V</span>
</div>
<h1 class="text-xl font-bold tracking-tight">Create Identity</h1>
</div>
<p class="text-slate-400 text-sm leading-relaxed">Enter your credentials to begin tracking your performance across the V-ecosystem.</p>
</div>
<form class="space-y-6">
<div class="space-y-4">
<div class="flex items-center justify-between px-1">
<label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Account Details</label>
</div>
<div class="relative group">
<div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">person</span>
</div>
<input class="tracker-input" placeholder="Legal Full Name" type="text"/>
</div>
<div class="relative group">
<div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">alternate_email</span>
</div>
<input class="tracker-input" placeholder="Primary Email Address" type="email"/>
</div>
<div class="relative group">
<div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">lock</span>
</div>
<input class="tracker-input" placeholder="Security Password" type="password"/>
<button class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-600 hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-lg">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-4 pt-2">
<div class="flex items-center justify-between px-1">
<label class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Primary Objective</label>
<span class="text-[10px] text-primary bg-primary/10 px-1.5 py-0.5 rounded">Required</span>
</div>
<div class="grid grid-cols-1 gap-2">
<button class="flex items-center justify-between p-4 rounded-md bg-surface-dark border border-primary/40 text-white ring-1 ring-primary/20" type="button">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">fitness_center</span>
<div class="text-left">
<div class="text-sm font-bold">VFit</div>
<div class="text-[10px] text-slate-400">High-performance athletic training</div>
</div>
</div>
<span class="material-symbols-outlined text-primary">radio_button_checked</span>
</button>
<button class="flex items-center justify-between p-4 rounded-md bg-surface-dark border border-border-dark text-slate-400 hover:border-slate-600 transition-colors" type="button">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">celebration</span>
<div class="text-left">
<div class="text-sm font-bold text-slate-200">VFun</div>
<div class="text-[10px] text-slate-500">Social events and community activities</div>
</div>
</div>
<span class="material-symbols-outlined text-slate-700">radio_button_unchecked</span>
</button>
<button class="flex items-center justify-between p-4 rounded-md bg-surface-dark border border-border-dark text-slate-400 hover:border-slate-600 transition-colors" type="button">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">spa</span>
<div class="text-left">
<div class="text-sm font-bold text-slate-200">VLife</div>
<div class="text-[10px] text-slate-500">Holistic wellness and longevity</div>
</div>
</div>
<span class="material-symbols-outlined text-slate-700">radio_button_unchecked</span>
</button>
</div>
</div>
<div class="pt-4 space-y-4">
<button class="w-full bg-primary hover:bg-[#0fd650] text-background-dark font-bold text-sm h-12 rounded-md shadow-lg shadow-primary/10 transition-all flex items-center justify-center gap-2 uppercase tracking-widest">
                        Proceed to Metrics
                        <span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-border-dark"></div>
<span class="flex-shrink-0 mx-4 text-slate-600 text-[10px] font-bold uppercase tracking-widest">Third-Party Auth</span>
<div class="flex-grow border-t border-border-dark"></div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 h-11 bg-surface-dark rounded-md border border-border-dark hover:bg-border-dark transition-colors text-white font-medium text-xs">
<img alt="Google" class="size-4 grayscale opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyFnDVDfPxvJRdA5T7yXeYHYsC1IybF7mTFWpyR0Ox8V-qMH5_zvcFvAL2uOYRbND0Er3lvgMH4CVWDsYxE3BtCKq6a-f2ucgwA66zHMQiT3EREcr16vZX3ZuXT3Rq3a0xD5TTm8Ejy0QO_CqVJVResCXv00wsVx3MckyKTMGRnRGqEm8NYI9mxy7pCQS72To0ItEJE7g9kc_2L742FQSUiGTIVApUHbhb_DTNg18caBgP2g9Y-91VVJslPqrEWMNGiifORWqwUz3S"/>
                            Google
                        </button>
<button class="flex items-center justify-center gap-2 h-11 bg-surface-dark rounded-md border border-border-dark hover:bg-border-dark transition-colors text-white font-medium text-xs">
<span class="material-symbols-outlined text-lg opacity-80">brand_family</span>
                            Apple
                        </button>
</div>
</div>
</form>
<div class="mt-8 pt-6 border-t border-border-dark/50 text-center">
<p class="text-slate-500 text-xs">
                    Already have an active profile? 
                    <a class="text-primary font-bold hover:underline underline-offset-4" href="#">Sign In</a>
</p>
</div>
</div>
<div class="mt-auto px-6 py-4 flex justify-between items-center bg-surface-dark/30">
<div class="flex gap-4">
<div class="flex flex-col">
<span class="text-[9px] uppercase font-bold text-slate-600 tracking-tighter">Server Status</span>
<span class="text-[10px] font-mono text-primary flex items-center gap-1">
<span class="size-1 rounded-full bg-primary animate-pulse"></span>
                        ONLINE
                    </span>
</div>
<div class="flex flex-col">
<span class="text-[9px] uppercase font-bold text-slate-600 tracking-tighter">Latency</span>
<span class="text-[10px] font-mono text-slate-400">12ms</span>
</div>
</div>
<div class="text-[10px] font-mono text-slate-600">v2.4.0-build</div>
</div>
</div>

</body></html>
