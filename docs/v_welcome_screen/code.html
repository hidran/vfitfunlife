<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>V Welcome Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#8b5cf6", // Purple from the 'Explore Full Catalog' button reference
                        "primary-glow": "#a78bfa",
                        "background-light": "#ffffff",
                        "background-dark": "#0f172a", // Deep dark blue/black
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                },
            },
        };
    </script>
<style>.glow-text {
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }
        .glow-box {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center overflow-hidden transition-colors duration-300">
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-primary rounded-full mix-blend-multiply filter blur-[80px] opacity-20 dark:opacity-20 animate-pulse-slow"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-cyan-500 rounded-full mix-blend-multiply filter blur-[80px] opacity-20 dark:opacity-20 animate-pulse-slow" style="animation-delay: 1.5s;"></div>
</div>
<main class="relative z-10 flex flex-col items-center justify-between w-full max-w-md px-6 py-12 h-screen">
<div class="flex-1"></div>
<div class="flex flex-col items-center justify-center flex-[2] w-full animate-float">
<div class="relative w-40 h-40 flex items-center justify-center mb-8">
<div class="absolute inset-0 border-2 border-primary/30 rounded-full animate-[spin_10s_linear_infinite]"></div>
<div class="absolute inset-2 border border-cyan-500/20 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
<div class="relative z-10">
<svg class="drop-shadow-[0_0_15px_rgba(139,92,246,0.6)]" fill="none" height="100" viewBox="0 0 100 100" width="100" xmlns="http://www.w3.org/2000/svg">
<path d="M20 25L50 85L80 25" stroke="url(#paint0_linear)" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<path d="M35 25L50 55L65 25" opacity="0.7" stroke="url(#paint1_linear)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
<defs>
<linearGradient gradientUnits="userSpaceOnUse" id="paint0_linear" x1="20" x2="80" y1="25" y2="85">
<stop stop-color="#8b5cf6"></stop>
<stop offset="1" stop-color="#06b6d4"></stop>
</linearGradient>
<linearGradient gradientUnits="userSpaceOnUse" id="paint1_linear" x1="35" x2="65" y1="25" y2="55">
<stop stop-color="#c084fc"></stop>
<stop offset="1" stop-color="#22d3ee"></stop>
</linearGradient>
</defs>
</svg>
</div>
</div>
<h1 class="text-4xl font-black tracking-tight text-gray-900 dark:text-white text-center mb-2">
<span class="bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-400">V</span>fitfunlife
            </h1>
<p class="text-gray-500 dark:text-gray-400 text-center text-sm font-medium tracking-wide max-w-[200px]">
                #DOitDIFFERENTLY
            </p>
</div>
<div class="flex flex-col items-center w-full space-y-6 mb-12">
<button class="group relative w-full max-w-[280px]">
<div class="absolute -inset-1 bg-gradient-to-r from-primary to-cyan-500 rounded-xl blur opacity-40 group-hover:opacity-75 transition duration-200"></div>
<div class="relative flex items-center justify-center w-full py-4 px-8 bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-700 rounded-xl shadow-xl transition-transform transform group-hover:scale-[1.02] active:scale-[0.98]">
<span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-500 mr-2">START</span>
<span class="material-icons-round text-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
</div>
</button>
<div class="flex flex-col items-center gap-4 opacity-70">
<div class="flex space-x-6">
<a class="text-gray-400 hover:text-primary transition-colors" href="#">
<span class="sr-only">Instagram</span>
<svg aria-hidden="true" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
<path clip-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772 4.902 4.902 0 011.772-1.153c.636-.247 1.363-.416 2.427-.465C9.673 2.013 10.03 2 12.484 2h.232zm3.296 4H8.388c-2.314 0-4.188 1.874-4.188 4.188v3.296c0 2.314 1.874 4.188 4.188 4.188h7.224c2.314 0 4.188-1.874 4.188-4.188V10.188c0-2.314-1.874-4.188-4.188-4.188zm-3.296 3.2c1.768 0 3.2 1.432 3.2 3.2s-1.432 3.2-3.2 3.2-3.2-1.432-3.2-3.2 1.432-3.2 3.2-3.2zM16.8 6.4c.44 0 .8.36.8.8s-.36.8-.8.8-.8-.36-.8-.8.36-.8.8-.8z" fill-rule="evenodd"></path>
</svg>
</a>
<a class="text-gray-400 hover:text-primary transition-colors" href="#">
<span class="sr-only">Twitter</span>
<svg aria-hidden="true" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
<path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84"></path>
</svg>
</a>
</div>
<p class="text-xs text-gray-400 dark:text-gray-600">Transforming fitness through technology</p>
</div>
</div>
</main>

</body></html>
